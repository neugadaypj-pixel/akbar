<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Finance Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>💼 Business Finance Tracker</h1>
      <p class="subtitle">Track your income and expenses in one place</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card income-card">
        <span class="label">Total Income</span>
        <span class="value" id="total-income">$0.00</span>
      </div>
      <div class="card expense-card">
        <span class="label">Total Expenses</span>
        <span class="value" id="total-expenses">$0.00</span>
      </div>
      <div class="card balance-card">
        <span class="label">Balance</span>
        <span class="value" id="balance">$0.00</span>
      </div>
    </section>

    <!-- Add Transaction Form -->
    <section class="form-card">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-row">
          <div class="field">
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>
          <div class="field">
            <label for="amount">Amount</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="0.00" required />
          </div>
          <div class="field">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required />
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="e.g. Sold product / Paid rent" required />
          </div>
          <div class="field">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="e.g. Sales, Rent, Utilities" />
          </div>
        </div>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <!-- Transactions List -->
    <section class="list-card">
      <h2>Transactions</h2>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="income">Income</button>
        <button class="filter-btn" data-filter="expense">Expenses</button>
      </div>
      <div id="transactions-list" class="transactions">
        <p class="empty-state">Loading transactions...</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
