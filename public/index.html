<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">🏪</span>
        <span class="brand-name" id="brand-name">Market Manager</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>📊</span> Dashboard</button>
        <button class="nav-item" data-view="pos"><span>🧾</span> New Sale (POS)</button>
        <button class="nav-item" data-view="products"><span>👕</span> Products</button>
        <button class="nav-item" data-view="customers"><span>👥</span> Customers</button>
        <button class="nav-item" data-view="suppliers"><span>🚚</span> Suppliers</button>
        <button class="nav-item" data-view="purchases"><span>📦</span> Purchases</button>
        <button class="nav-item" data-view="expenses"><span>💸</span> Expenses</button>
        <button class="nav-item" data-view="locations"><span>📍</span> Locations</button>
        <button class="nav-item" data-view="reports"><span>📈</span> Reports</button>
        <button class="nav-item" data-view="settings"><span>⚙️</span> Settings</button>
      </nav>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <script src="app.js"></script>
</body>
</html>
