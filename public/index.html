<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🏪</div>
        <div class="brand-text">
          <span class="brand-name" id="brand-name">Market Manager</span>
          <span class="brand-tag">Business Suite</span>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span class="nav-ico">📊</span> Dashboard</button>
        <button class="nav-item" data-view="pos"><span class="nav-ico">🧾</span> New Sale (POS)</button>
        <button class="nav-item" data-view="products"><span class="nav-ico">👕</span> Products</button>
        <button class="nav-item" data-view="customers"><span class="nav-ico">👥</span> Customers</button>
        <button class="nav-item" data-view="suppliers"><span class="nav-ico">🚚</span> Suppliers</button>
        <button class="nav-item" data-view="purchases"><span class="nav-ico">📦</span> Purchases</button>
        <button class="nav-item" data-view="expenses"><span class="nav-ico">💸</span> Expenses</button>
        <button class="nav-item" data-view="locations"><span class="nav-ico">📍</span> Locations</button>
        <button class="nav-item" data-view="reports"><span class="nav-ico">📈</span> Reports</button>
        <button class="nav-item" data-view="settings"><span class="nav-ico">⚙️</span> Settings</button>
      </nav>
      <div class="sidebar-footer">
        <span class="dot"></span> Live · Data synced
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <div id="view-container"></div>
    </main>
  </div>

  <!-- Toast container -->
  <div id="toast-container"></div>

  <!-- Modal container -->
  <div id="modal-container"></div>

  <script src="app.js"></script>
</body>
</html>
